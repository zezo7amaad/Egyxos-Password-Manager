services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: egyxos
      POSTGRES_USER: egyxos
      POSTGRES_PASSWORD: change-me
    volumes: [egyxos-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
volumes:
  egyxos-postgres:
